<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Mystical Alchemical Cauldron</title>
<desc id="desc">A dark fantasy line art cauldron with glowing liquid, magical steam, musical note and quill shapes, and ember flames.</desc>

<style>
 :root{ --gold:#d4af69; --amber:#e8a020; --ember:#c45a20; --dark:#080c12; }
 svg{ background:transparent; }
 .line{ fill:none; stroke:var(--gold); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
 .thin{ fill:none; stroke:var(--gold); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; opacity:.9; }
 .fine{ fill:none; stroke:var(--gold); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; opacity:.7; }
 .amber{ fill:none; stroke:var(--amber); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
 .ember{ fill:none; stroke:var(--ember); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
 .glow{ filter:url(#goldGlow); }
 .soft{ opacity:.55; }
 .dim{ opacity:.35; }
 .bodyFill{ fill:url(#cauldronShade); stroke:var(--gold); stroke-width:5; stroke-linejoin:round; }
 .liquidFill{ fill:url(#liquidGlow); stroke:var(--amber); stroke-width:4; }
 .steam{ fill:none; stroke:var(--amber); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; filter:url(#goldGlow); opacity:.9; }
 .steamThin{ fill:none; stroke:var(--gold); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; filter:url(#goldGlow); opacity:.45; }
 .spark{ fill:var(--amber); filter:url(#goldGlow); }
 .rune{ fill:none; stroke:var(--gold); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.75; }
 .fireFill{ fill:url(#fireGlow); stroke:var(--ember); stroke-width:3; stroke-linejoin:round; filter:url(#emberGlow); }
</style>

<defs>
 <radialGradient id="liquidGlow" cx="50%" cy="45%" r="60%">
  <stop offset="0%" stop-color="#fff1a8" stop-opacity=".95"/>
  <stop offset="32%" stop-color="#e8a020" stop-opacity=".75"/>
  <stop offset="75%" stop-color="#a95b12" stop-opacity=".45"/>
  <stop offset="100%" stop-color="#080c12" stop-opacity=".15"/>
 </radialGradient>
 <linearGradient id="cauldronShade" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#d4af69" stop-opacity=".22"/>
  <stop offset="45%" stop-color="#8b5a22" stop-opacity=".25"/>
  <stop offset="100%" stop-color="#080c12" stop-opacity=".15"/>
 </linearGradient>
 <radialGradient id="fireGlow" cx="50%" cy="40%" r="70%">
  <stop offset="0%" stop-color="#ffd75a" stop-opacity=".95"/>
  <stop offset="45%" stop-color="#e8a020" stop-opacity=".8"/>
  <stop offset="100%" stop-color="#c45a20" stop-opacity=".65"/>
 </radialGradient>
 <filter id="goldGlow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.83 0 1 0 0 0.55 0 0 1 0 0.10 0 0 0 .85 0" result="goldBlur"/>
  <feMerge><feMergeNode in="goldBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <filter id="emberGlow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.80 0 1 0 0 0.28 0 0 1 0 0.05 0 0 0 .85 0" result="emberBlur"/>
  <feMerge><feMergeNode in="emberBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>

<!-- soft upward magical glow -->
<ellipse cx="512" cy="560" rx="250" ry="180" fill="#e8a020" opacity=".07" filter="url(#goldGlow)"/>
<ellipse cx="512" cy="480" rx="170" ry="260" fill="#e8a020" opacity=".05" filter="url(#goldGlow)"/>

