<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hearth Mastery</title>
<meta name="theme-color" content="#0d0b08">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:radial-gradient(ellipse at 50% 40%,#1a1510 0%,#0d0b08 70%);}
  .welcome-inner{max-width:420px;width:100%;}
  .w-logo{font-size:3.5rem;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(212,175,105,0.3));}
  .w-title{font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.2rem);color:var(--text);margin-bottom:6px;text-shadow:0 0 30px rgba(212,175,105,0.15);}
  .w-sub{font-family:var(--mono);font-size:0.7rem;color:var(--gold);opacity:0.5;letter-spacing:0.12em;margin-bottom:32px;}
  .w-quote{font-style:italic;color:var(--text3);font-size:0.85rem;line-height:1.6;margin-bottom:40px;max-width:340px;margin-left:auto;margin-right:auto;}
  .login-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:left;}
  .login-box h3{font-family:var(--serif);color:var(--gold);font-size:0.9rem;margin-bottom:16px;text-align:center;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--mono);font-size:0.6rem;color:var(--text3);letter-spacing:0.1em;margin-bottom:4px;}
  .field input{width:100%;padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--sans);font-size:0.85rem;outline:none;transition:border-color 0.3s;}
  .field input:focus{border-color:var(--gold);}
  .field input::placeholder{color:var(--text3);}
  .login-btn{width:100%;padding:12px;font-family:var(--serif);font-size:0.9rem;font-weight:600;background:linear-gradient(180deg,var(--gold),var(--amber));color:#1a1210;border:none;border-bottom:3px solid #8b6914;border-radius:8px;cursor:pointer;transition:all 0.2s;margin-top:4px;}
  .login-btn:hover{box-shadow:0 4px 20px rgba(212,175,105,0.3);}
  .login-btn:active{border-bottom-width:1px;transform:translateY(2px);}
  .login-hint{text-align:center;margin-top:12px;font-family:var(--mono);font-size:0.55rem;color:var(--text3);letter-spacing:0.05em;}
  .guest-link{text-align:center;margin-top:16px;}
  .guest-link a{font-family:var(--mono);font-size:0.65rem;color:var(--text3);text-decoration:underline;text-underline-offset:3px;cursor:pointer;transition:color 0.2s;}
  .guest-link a:hover{color:var(--gold);}
  /* Profile select (returning user) */
  .profile-select{display:none;text-align:center;}
  .profile-select.vis{display:block;}
  .login-form.vis{display:block;}
  .login-form.hide{display:none;}
  .p-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;text-align:left;display:flex;align-items:center;gap:12px;}
  .p-card:hover{border-color:var(--border2);transform:translateY(-1px);}
  .p-avatar{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
  .p-name{font-family:var(--serif);color:var(--text);font-size:0.85rem;}
  .p-meta{font-family:var(--mono);font-size:0.55rem;color:var(--text3);margin-top:1px;}
  .p-level{font-family:var(--mono);font-size:0.5rem;color:var(--gold);background:rgba(212,175,105,0.08);padding:1px 6px;border-radius:2px;display:inline-block;margin-top:2px;}
</style>
</head>
<body>

<div class="welcome">
  <div class="welcome-inner">
    <div class="w-logo">🔥</div>
    <div class="w-title">The Hearth Mastery</div>
    <div class="w-sub">// GUITAR LEARNING SIMULATOR</div>
    <div class="w-quote">"A roadmap to somewhere where we end up at something great and hopeful."</div>

    <!-- Login form -->
    <div class="login-form vis" id="loginForm">
      <div class="login-box">
        <h3>Enter the Hearth</h3>
        <div class="field">
          <label>NAME</label>
          <input type="text" id="nameInput" placeholder="What should we call you?" autocomplete="off">
        </div>
        <div class="field">
          <label>CODE (OPTIONAL)</label>
          <input type="text" id="codeInput" placeholder="Teacher invite code" autocomplete="off">
        </div>
        <button class="login-btn" id="enterBtn">Begin Your Journey →</button>
      </div>
      <div class="login-hint">First time? Just enter your name. No account needed.</div>
    </div>

    <!-- Returning user profile select -->
    <div class="profile-select" id="profileSelect">
      <p style="font-family:var(--mono);font-size:0.65rem;color:var(--text3);margin-bottom:12px;letter-spacing:0.08em;">WELCOME BACK</p>
      <div id="profileCards"></div>
      <div class="guest-link" style="margin-top:16px;">
        <a onclick="showNewUser()">+ New Student</a>
      </div>
    </div>
  </div>
</div>

<script>
// Check for returning users
const users = JSON.parse(localStorage.getItem('hearth_users') || '[]');
const params = new URLSearchParams(window.location.search);

if (users.length > 0 && !params.get('new')) {
  // Show profile select
  document.getElementById('loginForm').classList.add('hide');
  document.getElementById('profileSelect').classList.add('vis');
  const container = document.getElementById('profileCards');
  users.forEach((u, i) => {
    const card = document.createElement('div');
    card.className = 'p-card';
    card.onclick = () => loginUser(u.name);
    card.innerHTML = `
      <div class="p-avatar">🎸</div>
      <div>
        <div class="p-name">${u.name}</div>
        <div class="p-meta">${u.hours || 0}h · ${u.nuggets || 0} 🪙</div>
        <div class="p-level">Level ${u.level || 1}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

document.getElementById('enterBtn').addEventListener('click', () => {
  const name = document.getElementById('nameInput').value.trim();
  if (name) loginUser(name);
});

document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const name = document.getElementById('nameInput').value.trim();
    if (name) loginUser(name);
  }
});

function loginUser(name) {
  // Save or update user
  let users = JSON.parse(localStorage.getItem('hearth_users') || '[]');
  let user = users.find(u => u.name.toLowerCase() === name.toLowerCase());
  if (!user) {
    user = { name, level: 1, hours: 0, nuggets: 0, created: Date.now(), lastLogin: Date.now() };
    users.push(user);
  } else {
    user.lastLogin = Date.now();
  }
  localStorage.setItem('hearth_users', JSON.stringify(users));
  localStorage.setItem('hearth_current', JSON.stringify(user));
  
  // Navigate to simulator
  window.location.href = '/simulator.html';
}

function showNewUser() {
  document.getElementById('profileSelect').classList.remove('vis');
  document.getElementById('loginForm').classList.remove('hide');
  document.getElementById('loginForm').classList.add('vis');
  document.getElementById('nameInput').focus();
}

// Auto-focus
setTimeout(() => {
  const input = document.getElementById('nameInput');
  if (input) input.focus();
}, 300);
</script>
</body>
</html>
