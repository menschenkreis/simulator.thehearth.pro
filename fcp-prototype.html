<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCP(SA) Part I — Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c12;
  --bg2: #0e1420;
  --bg3: #151e2e;
  --surface: #1a2436;
  --border: rgba(100,180,220,0.1);
  --border2: rgba(100,180,220,0.2);
  --text: #d8e8f0;
  --text2: #8aa8c0;
  --text3: #5a7088;
  --cyan: #40c8e8;
  --teal: #38b2a0;
  --purple: #8868d0;
  --rose: #d06888;
  --amber: #d0a040;
  --green: #50b870;
  --blue: #5090d0;
  --red: #d05050;
  --serif: 'Cinzel', serif;
  --sans: 'DM Sans', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6;-webkit-font-smoothing:antialiased}

/* Scanlines */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);opacity:0.4}
/* Vignette */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9997;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.4) 100%)}

/* ══ HEADER ══ */
.header{text-align:center;padding:40px 20px 20px;position:relative;z-index:10}
.header h1{font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.4rem);color:var(--cyan);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.header .subtitle{font-size:0.85rem;color:var(--text2);letter-spacing:2px;text-transform:uppercase}
.header .exam-badge{display:inline-block;margin-top:12px;padding:4px 16px;border:1px solid var(--cyan);border-radius:20px;font-size:0.7rem;color:var(--cyan);letter-spacing:1.5px;text-transform:uppercase;opacity:0.7}

/* ══ PROGRESS BAR ══ */
.progress-bar{max-width:600px;margin:20px auto;padding:0 20px}
.progress-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));border-radius:2px;transition:width 0.6s ease;width:0%}
.progress-label{display:flex;justify-content:space-between;margin-top:6px;font-size:0.7rem;color:var(--text3);font-family:var(--mono)}

/* ══ BODY MAP ══ */
.body-map-container{position:relative;max-width:520px;margin:30px auto;padding:0 20px}
.body-map-container h2{font-family:var(--serif);font-size:1rem;color:var(--text2);text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}

.body-svg{width:100%;height:auto}
.body-svg .node{cursor:pointer;transition:all 0.3s ease}
.body-svg .node:hover{filter:brightness(1.4) drop-shadow(0 0 12px currentColor)}
.body-svg text{pointer-events:none}
.body-svg .ring{animation:pulse 2.4s infinite}
.body-svg .done .ring{stroke-dasharray:none;opacity:1}

/* ══ SYSTEM GRID (below body map) ══ */
.systems-grid{max-width:700px;margin:10px auto 30px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.system-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden}
.system-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);opacity:0.4;transition:opacity 0.3s}
.system-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.system-card:hover::before{opacity:0.8}
.system-card.completed{border-color:var(--accent)}
.system-card.completed::before{opacity:1}
.system-card .icon{font-size:1.4rem;margin-bottom:8px}
.system-card h3{font-family:var(--serif);font-size:0.8rem;color:var(--text);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.system-card .topic-count{font-size:0.7rem;color:var(--text3);font-family:var(--mono)}
.system-card .card-progress{margin-top:10px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.system-card .card-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s}

/* ══ TOPIC PANEL (slides in) ══ */
.topic-panel{position:fixed;inset:0;z-index:100;display:none;background:var(--bg)}
.topic-panel.open{display:flex;flex-direction:column}
.panel-header{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid var(--border)}
.panel-back{width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.panel-back:hover{background:var(--surface);border-color:var(--cyan)}
.panel-title{font-family:var(--serif);font-size:1rem;letter-spacing:1px;text-transform:uppercase;color:var(--text)}
.panel-system{font-size:0.7rem;color:var(--text3);font-family:var(--mono);letter-spacing:1px;text-transform:uppercase}

.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ══ TOPIC LIST ══ */
.topic-list{max-width:600px;margin:0 auto}
.topic-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;background:var(--bg2)}
.topic-item:hover{border-color:var(--border2);background:var(--bg3)}
.topic-item.completed-topic{border-color:var(--teal)}
.topic-num{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--text3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:0.7rem;color:var(--text3);flex-shrink:0;transition:all 0.3s}
.topic-item.completed-topic .topic-num{border-color:var(--teal);color:var(--teal);background:rgba(56,178,160,0.1)}
.topic-item.active-topic .topic-num{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px rgba(64,200,232,0.3)}
.topic-info{flex:1;min-width:0}
.topic-info h4{font-size:0.85rem;color:var(--text);margin-bottom:2px}
.topic-info .topic-type{font-size:0.65rem;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px}
.topic-chevron{color:var(--text3);font-size:0.8rem;transition:transform 0.2s}
.topic-item:hover .topic-chevron{transform:translateX(3px);color:var(--text2)}

/* ══ STAIRCASE VIEW ══ */
.staircase-view{max-width:500px;margin:0 auto}
.staircase-view h3{font-family:var(--serif);font-size:0.9rem;color:var(--cyan);text-align:center;letter-spacing:1px;margin-bottom:24px;text-transform:uppercase}

.stair{display:flex;gap:14px;margin-bottom:16px;align-items:stretch}
.stair-tread{width:4px;flex-shrink:0;border-radius:2px;transition:all 0.4s;background:var(--bg3)}
.stair.active .stair-tread{background:var(--cyan);box-shadow:0 0 8px rgba(64,200,232,0.3)}
.stair.completed .stair-tread{background:var(--teal)}
.stair-content{flex:1;padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);transition:all 0.3s;cursor:pointer}
.stair.active .stair-content{border-color:var(--cyan);background:var(--bg3)}
.stair.completed .stair-content{border-color:var(--teal)}
.stair-content:hover{border-color:var(--border2)}
.stair-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stair-num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--text3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:0.65rem;color:var(--text3);flex-shrink:0}
.stair.active .stair-num{border-color:var(--cyan);color:var(--cyan)}
.stair.completed .stair-num{border-color:var(--teal);color:var(--teal);background:rgba(56,178,160,0.15)}
.stair-title{font-family:var(--serif);font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.stair.active .stair-title{color:var(--text)}
.stair-desc{font-size:0.78rem;color:var(--text3);line-height:1.5}
.stair.active .stair-desc{color:var(--text2)}

/* ══ STAIR CONTENT DETAIL ══ */
.stair-detail{max-width:500px;margin:20px auto;padding:0 20px}
.stair-detail-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;animation:fadeIn 0.3s ease}
.stair-detail-card h4{font-family:var(--serif);font-size:0.85rem;color:var(--cyan);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.stair-detail-card p{font-size:0.82rem;color:var(--text2);line-height:1.7;margin-bottom:12px}
.stair-detail-card ul{list-style:none;margin-bottom:16px}
.stair-detail-card li{font-size:0.8rem;color:var(--text2);padding:4px 0;padding-left:16px;position:relative}
.stair-detail-card li::before{content:'›';position:absolute;left:0;color:var(--cyan)}
.stair-detail-card .note-box{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-top:12px}
.stair-detail-card .note-box .label{font-size:0.65rem;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}

.complete-btn{display:block;width:100%;margin-top:16px;padding:12px;border:1px solid var(--teal);border-radius:8px;background:transparent;color:var(--teal);font-family:var(--serif);font-size:0.8rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all 0.3s}
.complete-btn:hover{background:rgba(56,178,160,0.1)}
.complete-btn.done{background:rgba(56,178,160,0.15);cursor:default}

/* ══ MCQ VIEW ══ */
.mcq-container{max-width:500px;margin:0 auto}
.mcq-question{font-size:0.88rem;color:var(--text);line-height:1.6;margin-bottom:16px}
.mcq-options{display:flex;flex-direction:column;gap:8px}
.mcq-option{padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:0.82rem;color:var(--text2);cursor:pointer;transition:all 0.2s;background:var(--bg2)}
.mcq-option:hover{border-color:var(--border2);background:var(--bg3)}
.mcq-option.selected{border-color:var(--cyan);background:rgba(64,200,232,0.08);color:var(--text)}
.mcq-option.correct{border-color:var(--green);background:rgba(80,184,112,0.1);color:var(--green)}
.mcq-option.wrong{border-color:var(--red);background:rgba(208,80,80,0.1);color:var(--red)}
.mcq-explanation{margin-top:16px;padding:16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:0.8rem;color:var(--text2);line-height:1.6;display:none}

/* ══ FLOATING GUIDE ══ */
.guide{position:fixed;bottom:20px;right:20px;z-index:50;display:flex;align-items:flex-end;gap:10px;max-width:300px;pointer-events:none}
.guide-bubble{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;border-bottom-right-radius:4px;padding:10px 14px;font-size:0.75rem;color:var(--text2);line-height:1.5;animation:fadeIn 0.4s ease;pointer-events:auto}
.guide-bubble .guide-name{font-family:var(--serif);font-size:0.65rem;color:var(--cyan);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.guide-icon{width:40px;height:40px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;pointer-events:auto}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ══ MOBILE ══ */
@media(max-width:600px){
  .systems-grid{grid-template-columns:1fr}
  .header h1{font-size:1.4rem}
  .guide{bottom:12px;right:12px;max-width:240px}
}

/* ══ EMBER PARTICLES ══ */
.ember{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--cyan);opacity:0;pointer-events:none;z-index:1;animation:emberFloat 10s ease-in-out infinite}
@keyframes emberFloat{0%{opacity:0;transform:translateY(0) scale(1)}10%{opacity:0.3}60%{opacity:0.08}100%{opacity:0;transform:translateY(-50vh) scale(0)}}
</style>
</head>
<body>

<!-- EMBER PARTICLES -->
<div class="ember" style="left:10%;animation-delay:0s"></div>
<div class="ember" style="left:25%;animation-delay:2s"></div>
<div class="ember" style="left:50%;animation-delay:4s"></div>
<div class="ember" style="left:75%;animation-delay:1s"></div>
<div class="ember" style="left:90%;animation-delay:3s"></div>

<!-- HEADER -->
<div class="header">
  <h1>FCP(SA) Part I</h1>
  <div class="subtitle">Master the Curriculum · Pass with Confidence</div>
  <div class="exam-badge">Colleges of Medicine of South Africa</div>
</div>

<!-- PROGRESS BAR -->
<div class="progress-bar">
  <div class="progress-track"><div class="progress-fill" id="mainProgress"></div></div>
  <div class="progress-label">
    <span id="progressText">0 of 10 systems started</span>
    <span id="progressPct">0%</span>
  </div>
</div>

<!-- BODY MAP -->
<div class="body-map-container">
  <h2>Select a System</h2>
  <svg class="body-svg" viewBox="0 0 900 1300" id="bodyMap">
    <defs>
      <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M32 0H0V32" fill="none" stroke="#153043" stroke-width=".7"/>
      </pattern>
      <pattern id="scan" width="1" height="9" patternUnits="userSpaceOnUse">
        <rect width="1" height="1" fill="#6ad7ff"/>
      </pattern>
      <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <rect width="900" height="1300" fill="url(#grid)"/>
    <rect width="900" height="1300" fill="url(#scan)" opacity=".12"/>

    <!-- BODY WIREFRAME -->
    <g id="body">
      <ellipse cx="450" cy="145" rx="72" ry="88" fill="none" stroke="#65d9ff" stroke-width="1.2" opacity=".28"/>
      <path d="M376 150c-15 10-25 28-25 48 0 33 22 57 52 68v48h94v-48c30-11 52-35 52-68 0-20-10-38-25-48" fill="none" stroke="#65d9ff" stroke-width="1.2" opacity=".28"/>
      <path d="M403 314c-86 23-132 89-154 194l-55 274 61 14 68-270 25 468h204l25-468 68 270 61-14-55-274c-22-105-68-171-154-194z" fill="none" stroke="#65d9ff" stroke-width="1.2" opacity=".28"/>
      <path d="M348 990l-36 210 63 35 38-245M552 990l36 210-63 35-38-245" fill="none" stroke="#65d9ff" stroke-width="1.2" opacity=".28"/>
      <path d="M450 80v1040M394 344c38 18 74 18 112 0M355 445h190M340 570h220M350 700h200M370 860h160" fill="none" stroke="#65d9ff" stroke-width=".7" opacity=".16"/>
      <path d="M383 138c39-20 95-20 134 0M382 174c45 25 91 25 136 0" fill="none" stroke="#65d9ff" stroke-width=".7" opacity=".16"/>
    </g>

    <!-- INTERNAL ORGANS -->
    <g id="organs">
      <path d="M398 128c-36-29-79 11-53 47-20 30 17 63 49 43 23 26 77 9 69-31 34-16 16-65-22-62-9-20-30-24-43 3z" fill="none" stroke="#b56cff" stroke-width="2" filter="url(#glow)" opacity=".8"/>
      <path d="M405 380c-63-10-96 42-88 130 59 4 89-42 95-107zM495 380c63-10 96 42 88 130-59 4-89-42-95-107z" fill="none" stroke="#55f1ff" stroke-width="2" filter="url(#glow)" opacity=".8"/>
      <path d="M452 426c39-31 80 13 53 67-22 44-80 31-80-14 0-20 10-38 27-53z" fill="none" stroke="#ff5f82" stroke-width="2" filter="url(#glow)" opacity=".8"/>
      <path d="M345 565c83-55 183-36 244 19-92 26-177 32-244-19zM476 620c56-46 116 23 61 71-52 45-122-23-61-71z" fill="none" stroke="#ffb33d" stroke-width="2" filter="url(#glow)" opacity=".8"/>
      <path d="M381 705c-39 9-50 68-14 88 41-15 56-67 14-88zM519 705c39 9 50 68 14 88-41-15-56-67-14-88z" fill="none" stroke="#4da3ff" stroke-width="2" filter="url(#glow)" opacity=".8"/>
      <path d="M330 355h240M300 795h300M350 990h200M260 760l70-280M640 760l-70-280" fill="none" stroke="#9cff73" stroke-width="2" filter="url(#glow)" opacity=".8"/>
    </g>

    <!-- LYMPH DOTS -->
    <g>
      <circle cx="380" cy="350" r="5" fill="#ffd75a" filter="url(#glow)"/>
      <circle cx="520" cy="350" r="5" fill="#ffd75a" filter="url(#glow)"/>
      <circle cx="340" cy="450" r="5" fill="#ffd75a" filter="url(#glow)"/>
      <circle cx="560" cy="450" r="5" fill="#ffd75a" filter="url(#glow)"/>
      <circle cx="315" cy="610" r="5" fill="#ffd75a" filter="url(#glow)"/>
      <circle cx="585" cy="610" r="5" fill="#ffd75a" filter="url(#glow)"/>
      <circle cx="365" cy="790" r="5" fill="#ffd75a" filter="url(#glow)"/>
      <circle cx="535" cy="790" r="5" fill="#ffd75a" filter="url(#glow)"/>
      <circle cx="385" cy="1010" r="5" fill="#ffd75a" filter="url(#glow)"/>
      <circle cx="515" cy="1010" r="5" fill="#ffd75a" filter="url(#glow)"/>
    </g>

    <!-- CONNECTORS -->
    <g>
      <path fill="none" stroke="#b56cff" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M292 170H405"/>
      <path fill="none" stroke="#55f1ff" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M258 410h125"/>
      <path fill="none" stroke="#ff5f82" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M525 455h130"/>
      <path fill="none" stroke="#ffb33d" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M520 640h135"/>
      <path fill="none" stroke="#4da3ff" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M245 810h130"/>
      <path fill="none" stroke="#ffd75a" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M500 240h150"/>
      <path fill="none" stroke="#ff9db2" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M245 610h160"/>
      <path fill="none" stroke="#9cff73" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M250 1030l105-110"/>
      <path fill="none" stroke="#ffd75a" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M520 890h135"/>
      <path fill="none" stroke="#2fffe6" stroke-width="2" stroke-dasharray="2 7" opacity=".8" d="M635 1130h80v55"/>
    </g>

    <!-- CLICKABLE SYSTEM NODES -->
    <g id="nodes">
      <g class="node" data-system="nervous" onclick="openSystem('nervous')" style="--c:#b56cff">
        <circle class="ring" cx="240" cy="170" r="52"/>
        <path class="icon" d="M218 174c-16-21 8-45 31-29 21-20 54 0 41 28 18 14 0 42-24 36-17 17-46 8-48-17" fill="none" stroke="#b56cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <circle cx="155" cy="250" r="17" fill="none" stroke="#b56cff" stroke-width="2"/><text x="149" y="257" fill="#fff" font-size="20">1</text>
        <text class="nt" x="185" y="258" fill="#e9f8ff" font-size="24">BRAIN</text><text class="sub" x="185" y="282" fill="#b56cff" font-size="15">Nervous System</text>
      </g>

      <g class="node" data-system="resp" onclick="openSystem('resp')" style="--c:#55f1ff">
        <circle class="ring" cx="190" cy="410" r="52"/>
        <path class="icon" d="M190 382v58M184 405c-28-32-48 0-43 35 22 4 43-13 43-35zM196 405c28-32 48 0 43 35-22 4-43-13-43-35z" fill="none" stroke="#55f1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <circle cx="85" cy="420" r="17" fill="none" stroke="#55f1ff" stroke-width="2"/><text x="79" y="427" fill="#fff" font-size="20">3</text>

      </g>

      <g class="node" data-system="cardio" onclick="openSystem('cardio')" style="--c:#ff5f82">
        <circle class="ring" cx="710" cy="455" r="52"/>
        <path class="icon" d="M710 485c-43-30-39-66-12-61 8 1 12 8 12 8s4-7 12-8c27-5 31 31-12 61z" fill="none" stroke="#ff5f82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <circle cx="790" cy="455" r="17" fill="none" stroke="#ff5f82" stroke-width="2"/><text x="784" y="462" fill="#fff" font-size="20">2</text>
        <text class="nt" x="815" y="455" fill="#e9f8ff" font-size="24">HEART</text><text class="sub" x="815" y="480" fill="#ff5f82" font-size="15">Cardiovascular</text>

        review: 'Haemophilia A: Factor VIII deficiency (X-linked). Haemophilia B: Factor IX deficiency. DIC: consumption of clotting factors → bleeding. Warfarin: inhibits vitamin K-dependent factors (II, VII, IX, X).',

    ]
  },
  msk: {
    name: 'Musculoskeletal',
    icon: '🦴',

        review: 'Osteoarthritis: cartilage degeneration (wear-and-tear). Rheumatoid arthritis: autoimmune synovial inflammation (symmetrical, erosive). Gout: urate crystal deposition (1st MTP).',

        own: 'Synovial joint = cartilage + synovial membrane + capsule + ligaments. 6 types by shape. OA = degenerative. RA = autoimmune. Gout = crystal.' },
      { name: 'Collagen & Connective Tissue', type: 'Clinical Chemistry',

        test: { q: 'Which MHC class presents antigens to CD8+ T cells?', opts: ['MHC I','MHC II','MHC III','MHC IV'], a: 0, exp: 'MHC I presents endogenous antigens (viral, tumour) to CD8+ cytotoxic T cells. MHC II presents exogenous antigens to CD4+ helper T cells.' },
        own: 'Innate = fast, non-specific (neutrophils, macrophages, complement). Adaptive = slow, specific, memory (B cells → antibodies, T cells → cell-mediated). MHC I → CD8. MHC II → CD4.' },
      { name: 'HIV Pathogenesis & AIDS', type: 'Pathophysiology',
        learn: 'HIV targets CD4+ T cells via CD4 receptor + CCR5/CXCR4 co-receptors. Viral RNA → reverse transcriptase → proviral DNA → integration → replication. CD4 count decline: >500 (normal) → 200-500 (symptomatic) → <200 (AIDS).',

        review: 'KS treatment: ART (immune reconstitution), chemotherapy for advanced disease. Burkitt\'s: intensive chemotherapy (CHOP-like). Both are aggressive but chemo-sensitive.',

        own: 'KS = HHV-8, spindle cell tumour, purple lesions. Burkitt\'s = EBV, B cell lymphoma, starry sky. Both AIDS-defining. Chemo-sensitive.' }

        review: 'OA management: weight loss, paracetamol, NSAIDs, joint replacement. Gout: acute = colchicine/NSAIDs. Chronic = allopurinol (urate-lowering). Avoid urate-lowering in acute phase.',
        test: { q: 'Which joint is most commonly affected in gout?', opts: ['Knee','Ankle','1st MTP','Wrist'], a: 2, exp: 'First metatarsophalangeal (MTP) joint is affected in ~50% of first gout attacks (podagra).' },
        own: 'OA = wear-and-tear, cartilage loss, osteophytes. Gout = urate crystals, 1st MTP, hyperuricaemia. OA: paracetamol → replacement. Gout: colchicine acute, allopurinol chronic.' }
    ]
  }
};

// ════════════════════════════════════════
// State
// ════════════════════════════════════════
let state = JSON.parse(localStorage.getItem('fcp_progress') || '{}');
// state format: { systemKey: { topics: { topicIdx: { steps: [bool,bool,bool,bool] } } } }

function saveState() { localStorage.setItem('fcp_progress', JSON.stringify(state)); }

function getSystemProgress(sysKey) {
  const sys = SYSTEMS[sysKey];
  if (!sys) return { done: 0, total: 0, pct: 0 };
  const total = sys.topics.length * 4;
  let done = 0;
  const s = state[sysKey];
  if (s && s.topics) {
    Object.values(s.topics).forEach(t => { if (t.steps) done += t.steps.filter(Boolean).length; });
  }
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}

function getTotalProgress() {
  let done = 0, total = 0;
  Object.keys(SYSTEMS).forEach(k => { const p = getSystemProgress(k); done += p.done; total += p.total; });
  return total ? Math.round((done / total) * 100) : 0;
}

function countStartedSystems() {
  return Object.keys(SYSTEMS).filter(k => state[k] && state[k].topics && Object.keys(state[k].topics).length > 0).length;
}

// ════════════════════════════════════════
// Render
// ════════════════════════════════════════
function renderGrid() {
  const grid = document.getElementById('systemsGrid');
  grid.innerHTML = '';
  Object.entries(SYSTEMS).forEach(([key, sys]) => {
    const prog = getSystemProgress(key);
    const completed = prog.pct === 100;
    const card = document.createElement('div');
    card.className = 'system-card' + (completed ? ' completed' : '');
    card.style.setProperty('--accent', sys.color);
    card.onclick = () => openSystem(key);
    card.innerHTML = `
      <div class="icon">${sys.icon}</div>
      <h3>${sys.name}</h3>
      <div class="topic-count">${sys.topics.length} topics · ${prog.pct}%</div>
      <div class="card-progress"><div class="card-progress-fill" style="width:${prog.pct}%"></div></div>
    `;
    grid.appendChild(card);
  });
}

function updateProgress() {
  const pct = getTotalProgress();
  document.getElementById('mainProgress').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  const started = countStartedSystems();
  document.getElementById('progressText').textContent = `${started} of ${Object.keys(SYSTEMS).length} systems started`;
}

function updateBodyMap() {
  Object.entries(SYSTEMS).forEach(([key, sys]) => {
    const el = document.querySelector(`.node[data-system="${key}"]`);
    if (!el) return;
    const prog = getSystemProgress(key);
    el.classList.remove('done');
    if (prog.pct === 100) el.classList.add('done');
  });
}

// ════════════════════════════════════════
// Panel Navigation
// ════════════════════════════════════════
let currentSystem = null;
let currentTopic = null;
let currentStep = null;

function openSystem(key) {
  currentSystem = key;
  const sys = SYSTEMS[key];
  document.getElementById('panelTitle').textContent = sys.name;
  document.getElementById('panelSystem').textContent = `${sys.topics.length} topics`;
  document.getElementById('topicPanel').classList.add('open');

  const body = document.getElementById('panelBody');
  body.innerHTML = '';

  sys.topics.forEach((topic, idx) => {
    const prog = state[key]?.topics?.[idx]?.steps || [];
    const allDone = prog.length === 4 && prog.every(Boolean);
    const anyDone = prog.some(Boolean);

    const item = document.createElement('div');
    item.className = 'topic-item' + (allDone ? ' completed-topic' : '') + (anyDone && !allDone ? ' active-topic' : '');
    item.onclick = () => openTopic(key, idx);
    item.innerHTML = `
      <div class="topic-num">${allDone ? '✓' : idx + 1}</div>
      <div class="topic-info">
        <h4>${topic.name}</h4>
        <div class="topic-type">${topic.type}</div>
      </div>
      <div class="topic-chevron">›</div>
    `;
    body.appendChild(item);
  });

  updateGuide(sys.topics.length > 0
    ? `Explore ${sys.name}. ${sys.topics.length} topics covering the FCP curriculum. Pick one to begin.`
    : `${sys.name} — coming soon.`);
}

function openTopic(sysKey, topicIdx) {
  currentSystem = sysKey;
  currentTopic = topicIdx;
  currentStep = null;
  const sys = SYSTEMS[sysKey];
  const topic = sys.topics[topicIdx];

  document.getElementById('panelTitle').textContent = topic.name;
  document.getElementById('panelSystem').textContent = sys.name + ' · Topic ' + (topicIdx + 1);

  const body = document.getElementById('panelBody');
  body.innerHTML = '';

  const steps = [
    { label: 'Learn', desc: 'Core concepts and mechanisms' },
    { label: 'Review', desc: 'Clinical correlations and high-yield connections' },
    { label: 'Test', desc: 'MCQ practice to check understanding' },
    { label: 'Consolidate', desc: 'Key takeaways and integration' }
  ];

  // Ensure state
  if (!state[sysKey]) state[sysKey] = { topics: {} };
  if (!state[sysKey].topics[topicIdx]) state[sysKey].topics[topicIdx] = { steps: [false, false, false, false] };
  const topicState = state[sysKey].topics[topicIdx].steps;

  // Find first incomplete step
  let activeIdx = topicState.findIndex(s => !s);
  if (activeIdx === -1) activeIdx = 3; // all done, show last

  const stairDiv = document.createElement('div');
  stairDiv.className = 'staircase-view';
  stairDiv.innerHTML = `<h3>The Staircase</h3>`;

  steps.forEach((step, i) => {
    const isActive = i === activeIdx;
    const isDone = topicState[i];
    const stair = document.createElement('div');
    stair.className = 'stair' + (isActive ? ' active' : '') + (isDone ? ' completed' : '');
    stair.innerHTML = `
      <div class="stair-tread"></div>
      <div class="stair-content" onclick="openStep(${i})">
        <div class="stair-header">
          <div class="stair-num">${isDone ? '✓' : i + 1}</div>
          <div class="stair-title">${step.label}</div>
        </div>
        <div class="stair-desc">${step.desc}</div>
      </div>
    `;
    stairDiv.appendChild(stair);
  });

  body.appendChild(stairDiv);
  updateGuide(`Step through the staircase: Learn → Review → Test → Consolidate. Start with the first incomplete step.`);
}

function openStep(stepIdx) {
  if (currentSystem === null || currentTopic === null) return;
  currentStep = stepIdx;
  const topic = SYSTEMS[currentSystem].topics[currentTopic];
  const body = document.getElementById('panelBody');

  if (!state[currentSystem]) state[currentSystem] = { topics: {} };
  if (!state[currentSystem].topics[currentTopic]) state[currentSystem].topics[currentTopic] = { steps: [false, false, false, false] };
  const topicState = state[currentSystem].topics[currentTopic].steps;

  const stepLabels = ['Learn', 'Review', 'Test', 'Consolidate'];

  if (stepIdx === 2) {
    // MCQ
    renderMCQ(body, topic, stepLabels[stepIdx]);
  } else if (stepIdx === 3) {
    // Consolidate
    renderConsolidate(body, topic, stepLabels[stepIdx]);
  } else {
    // Learn or Review
    const content = stepIdx === 0 ? topic.learn : topic.review;
    body.innerHTML = `
      <div class="stair-detail">
        <div class="stair-detail-card">
          <h4>${stepLabels[stepIdx]}</h4>
          <p>${content}</p>
          <button class="complete-btn ${topicState[stepIdx] ? 'done' : ''}" onclick="completeStep(${stepIdx})">
            ${topicState[stepIdx] ? '✓ Completed' : 'Mark as Complete'}
          </button>
        </div>
      </div>
    `;
    const tips = [
      'Take your time with the fundamentals. Understanding the mechanism beats memorising the name.',
      'Clinical correlations are where exam gold lives. Connect the basic science to the bedside.',
      'Test yourself honestly. If you can explain it, you know it.',
      'This is yours now. The key takeaway — carry it forward.'
    ];
    updateGuide(tips[stepIdx]);
  }
}

function renderMCQ(body, topic, label) {
  const mcq = topic.test;
  body.innerHTML = `
    <div class="stair-detail">
      <div class="stair-detail-card">
        <h4>${label}</h4>
        <div class="mcq-container">
          <div class="mcq-question">${mcq.q}</div>
          <div class="mcq-options" id="mcqOptions">
            ${mcq.opts.map((opt, i) => `<div class="mcq-option" onclick="selectMCQ(${i})" data-idx="${i}">${String.fromCharCode(65 + i)}. ${opt}</div>`).join('')}
          </div>
          <div class="mcq-explanation" id="mcqExplanation">
            <strong>Explanation:</strong> ${mcq.exp}
          </div>
          <button class="complete-btn" id="mcqComplete" style="display:none" onclick="completeStep(2)">
            Mark as Complete
          </button>
        </div>
      </div>
    </div>
  `;
  window._mcqAnswer = mcq.a;
  window._mcqAnswered = false;
}

function selectMCQ(idx) {
  if (window._mcqAnswered) return;
  window._mcqAnswered = true;
  const opts = document.querySelectorAll('.mcq-option');
  opts.forEach((el, i) => {
    if (i === window._mcqAnswer) el.classList.add('correct');
    if (i === idx && i !== window._mcqAnswer) el.classList.add('wrong');
  });
  document.getElementById('mcqExplanation').style.display = 'block';
  document.getElementById('mcqComplete').style.display = 'block';
  if (idx === window._mcqAnswer) {
    updateGuide('Correct! Well done. Clinical reasoning is building.');
  } else {
    updateGuide('Not quite. Read the explanation — understanding why matters more than getting it right.');
  }
}

function renderConsolidate(body, topic, label) {
  body.innerHTML = `
    <div class="stair-detail">
      <div class="stair-detail-card">
        <h4>${label}</h4>
        <div class="note-box">
          <div class="label">Key Takeaway</div>
          <p>${topic.own}</p>
        </div>
        <button class="complete-btn ${topicState()[2] ? 'done' : ''}" onclick="completeStep(3)">
          ${topicState()[2] ? '✓ Completed' : 'Mark as Complete'}
        </button>
      </div>
    </div>
  `;
  updateGuide('This is the consolidation step. If you can teach this to someone else, you own it.');
}

function topicState() {
  if (currentSystem === null || currentTopic === null) return [false,false,false,false];
  return state[currentSystem]?.topics?.[currentTopic]?.steps || [false,false,false,false];
}

function completeStep(stepIdx) {
  if (currentSystem === null || currentTopic === null) return;
  if (!state[currentSystem]) state[currentSystem] = { topics: {} };
  if (!state[currentSystem].topics[currentTopic]) state[currentSystem].topics[currentTopic] = { steps: [false, false, false, false] };
  state[currentSystem].topics[currentTopic].steps[stepIdx] = true;
  saveState();
  updateProgress();
  updateBodyMap();
  renderGrid();

  // Re-render current step
  if (currentStep !== null) openStep(currentStep);
}

function closePanel() {
  document.getElementById('topicPanel').classList.remove('open');
  currentSystem = null;
  currentTopic = null;
  currentStep = null;
}

function updateGuide(text) {
  document.getElementById('guideText').textContent = text;
}

// ════════════════════════════════════════
// Init
// ════════════════════════════════════════
renderGrid();
updateProgress();
updateBodyMap();

// Body map click from SVG
document.querySelectorAll('.node[data-system]').forEach(el => {
  el.addEventListener('click', () => openSystem(el.dataset.system));
});
</script>
