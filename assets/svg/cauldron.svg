<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Mystical Alchemical Cauldron</title>
<desc id="desc">A dark fantasy line art cauldron with glowing liquid, magical steam, musical note and quill shapes, and ember flames.</desc>

<style>
 :root{
 --gold:#d4af69;
 --amber:#e8a020;
 --ember:#c45a20;
 --dark:#080c12;
 }

 svg{
 background:transparent;
 }

 .line{
 fill:none;
 stroke:var(--gold);
 stroke-width:5;
 stroke-linecap:round;
 stroke-linejoin:round;
 }

 .thin{
 fill:none;
 stroke:var(--gold);
 stroke-width:2.5;
 stroke-linecap:round;
 stroke-linejoin:round;
 opacity:.9;
 }

 .fine{
 fill:none;
 stroke:var(--gold);
 stroke-width:1.6;
 stroke-linecap:round;
 stroke-linejoin:round;
 opacity:.7;
 }

 .amber{
 fill:none;
 stroke:var(--amber);
 stroke-width:4;
 stroke-linecap:round;
 stroke-linejoin:round;
 }

 .ember{
 fill:none;
 stroke:var(--ember);
 stroke-width:4;
 stroke-linecap:round;
 stroke-linejoin:round;
 }

 .glow{
 filter:url(#goldGlow);
 }

 .soft{
 opacity:.55;
 }

 .dim{
 opacity:.35;
 }

 .bodyFill{
 fill:url(#cauldronShade);
 stroke:var(--gold);
 stroke-width:5;
 stroke-linejoin:round;
 }

 .liquidFill{
 fill:url(#liquidGlow);
 stroke:var(--amber);
 stroke-width:4;
 }

 .steam{
 fill:none;
 stroke:var(--amber);
 stroke-width:4;
 stroke-linecap:round;
 stroke-linejoin:round;
 filter:url(#goldGlow);
 opacity:.9;
 }

 .steamThin{
 fill:none;
 stroke:var(--gold);
 stroke-width:2;
 stroke-linecap:round;
 stroke-linejoin:round;
 filter:url(#goldGlow);
 opacity:.45;
 }

 .spark{
 fill:var(--amber);
 filter:url(#goldGlow);
 }

 .rune{
 fill:none;
 stroke:var(--gold);
 stroke-width:2;
 stroke-linecap:round;
 stroke-linejoin:round;
 opacity:.75;
 }

 .fireFill{
 fill:url(#fireGlow);
 stroke:var(--ember);
 stroke-width:3;
 stroke-linejoin:round;
 filter:url(#emberGlow);
 }
</style>

<defs>
 <radialGradient id="liquidGlow" cx="50%" cy="45%" r="60%">
 <stop offset="0%" stop-color="#fff1a8" stop-opacity=".95"/>
 <stop offset="32%" stop-color="#e8a020" stop-opacity=".75"/>
 <stop offset="75%" stop-color="#a95b12" stop-opacity=".45"/>
 <stop offset="100%" stop-color="#080c12" stop-opacity=".15"/>
 </radialGradient>

 <linearGradient id="cauldronShade" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#d4af69" stop-opacity=".22"/>
 <stop offset="45%" stop-color="#8b5a22" stop-opacity=".25"/>
 <stop offset="100%" stop-color="#080c12" stop-opacity=".15"/>
 </linearGradient>

 <radialGradient id="fireGlow" cx="50%" cy="40%" r="70%">
 <stop offset="0%" stop-color="#ffd75a" stop-opacity=".95"/>
 <stop offset="45%" stop-color="#e8a020" stop-opacity=".8"/>
 <stop offset="100%" stop-color="#c45a20" stop-opacity=".65"/>
 </radialGradient>

 <filter id="goldGlow" x="-80%" y="-80%" width="260%" height="260%">
 <feGaussianBlur stdDeviation="5" result="blur"/>
 <feColorMatrix
 in="blur"
 type="matrix"
 values="
 1 0 0 0 0.83
 0 1 0 0 0.55
 0 0 1 0 0.10
 0 0 0 .85 0"
 result="goldBlur"/>
 <feMerge>
 <feMergeNode in="goldBlur"/>
 <feMergeNode in="SourceGraphic"/>
 </feMerge>
 </filter>

 <filter id="emberGlow" x="-80%" y="-80%" width="260%" height="260%">
 <feGaussianBlur stdDeviation="5" result="blur"/>
 <feColorMatrix
 in="blur"
 type="matrix"
 values="
 1 0 0 0 0.80
 0 1 0 0 0.28
 0 0 1 0 0.05
 0 0 0 .85 0"
 result="emberBlur"/>
 <feMerge>
 <feMergeNode in="emberBlur"/>
 <feMergeNode in="SourceGraphic"/>
 </feMerge>
 </filter>
</defs>

<!-- soft upward magical glow -->
<ellipse cx="512" cy="560" rx="250" ry="180" fill="#e8a020" opacity=".07" filter="url(#goldGlow)"/>
<ellipse cx="512" cy="480" rx="170" ry="260" fill="#e8a020" opacity=".05" filter="url(#goldGlow)"/>

<!-- magical steam, upper 60% -->
<g id="steam">
 <!-- central living tendril -->
 <path class="steam"
 d="M516 596
 C492 535 570 512 539 445
 C511 386 449 378 490 311
 C524 255 606 256 579 174
 C564 129 521 119 502 153
 C488 179 517 196 535 177" />

 <path class="steamThin"
 d="M534 596
 C574 530 610 510 591 454
 C574 403 523 386 553 334
 C579 288 642 278 626 219
 C617 184 590 163 559 158" />

 <!-- left tendril with abstract musical note -->
 <path class="steam"
 d="M406 600
 C375 544 396 501 447 461
 C498 421 431 357 354 384
 C298 403 287 462 339 493" />

 <path class="steamThin"
 d="M392 578
 C351 536 354 489 404 449
 C442 419 426 389 382 394" />

 <!-- abstract musical note in steam -->
 <path class="amber glow"
 d="M403 374
 L403 480
 C385 468 356 475 344 497
 C330 523 355 548 388 535
 C416 524 425 497 409 481
 M403 374
 C439 410 476 406 494 370
 C468 387 438 389 403 374Z" />

 <!-- right tendril, abstract quill form -->
 <path class="steam"
 d="M616 602
 C666 548 626 498 671 438
 C716 378 786 356 773 275
 C747 328 703 350 691 410
 C681 459 720 501 664 551" />

 <path class="steamThin"
 d="M640 586
 C694 532 682 481 715 420
 C741 371 760 332 770 277" />

 <!-- quill feather ribs -->
 <path class="thin glow"
 d="M775 274
 C741 322 717 375 694 450" />
 <path class="fine glow" d="M747 321 C718 319 704 333 690 351"/>
 <path class="fine glow" d="M733 358 C705 356 687 373 677 390"/>
 <path class="fine glow" d="M718 398 C694 397 676 414 664 435"/>
 <path class="fine glow" d="M760 305 C760 337 748 355 729 375"/>
 <path class="fine glow" d="M746 344 C746 375 732 396 710 416"/>

 <!-- little inner curls -->
 <path class="steamThin" d="M512 270 C487 238 530 211 548 242 C560 263 537 277 521 263"/>
 <path class="steamThin" d="M574 417 C607 387 643 428 616 456 C594 479 566 451 587 432"/>
 <path class="steamThin" d="M357 331 C319 304 349 256 394 271 C424 281 422 317 390 315"/>
</g>

<!-- sparks -->
<g id="sparks">
 <circle class="spark" cx="337" cy="294" r="3"/>
 <circle class="spark" cx="688" cy="263" r="2.6"/>
 <circle class="spark" cx="449" cy="210" r="2"/>
 <circle class="spark" cx="621" cy="333" r="2.4"/>
 <circle class="spark" cx="300" cy="451" r="2.5"/>
 <circle class="spark" cx="748" cy="479" r="2.2"/>
 <path class="amber glow" d="M728 342 l6 12 12 6 -12 6 -6 12 -6-12 -12-6 12-6z"/>
 <path class="amber glow" d="M290 383 l4 8 8 4 -8 4 -4 8 -4-8 -8-4 8-4z"/>
</g>

<!-- cauldron handles behind body -->
<g id="handles" class="glow">
 <path class="line"
 d="M264 610
 C189 596 145 666 179 724
 C199 759 239 756 249 723
 C258 693 220 691 220 720" />
 <path class="thin"
 d="M253 637
 C202 631 174 674 196 710
 C208 730 229 731 235 714" />

 <path class="line"
 d="M760 610
 C835 596 879 666 845 724
 C825 759 785 756 775 723
 C766 693 804 691 804 720" />
 <path class="thin"
 d="M771 637
 C822 631 850 674 828 710
 C816 730 795 731 789 714" />
</g>

<!-- cauldron body -->
<g id="cauldron">
 <!-- rim outer and inner -->
 <ellipse class="liquidFill glow" cx="512" cy="602" rx="308" ry="70"/>
 <ellipse class="line glow" cx="512" cy="600" rx="318" ry="78"/>
 <ellipse class="thin glow" cx="512" cy="602" rx="278" ry="51"/>

 <!-- body fill -->
 <path class="bodyFill"
 d="M224 620
 C224 620 240 770 340 800
 C420 824 604 824 684 800
 C784 770 800 620 800 620" />

 <!-- rune patterns on body -->
 <path class="rune" d="M360 660 L360 720 M345 690 L375 690"/>
 <path class="rune" d="M440 670 L440 730 M425 700 Q440 685 455 700"/>
 <path class="rune" d="M520 675 L520 735 M505 705 L535 705"/>
 <path class="rune" d="M600 670 L600 730 M585 700 L615 700"/>
 <path class="rune" d="M680 660 L680 720 M665 690 Q680 675 695 690"/>
</g>

<!-- fire beneath -->
<path class="fireFill"
 d="M420 830
 C430 800 460 810 475 790
 C490 770 510 780 520 760
 C530 780 550 770 565 790
 C580 810 610 800 604 830
 Q560 820 512 825 Q464 820 420 830 Z"
 fill="url(#fireGlow)" stroke="var(--ember)" stroke-width="3"/>

<!-- small flame accents -->
<path class="ember soft" d="M445 820 Q450 805 460 812"/>
<path class="ember soft" d="M525 815 Q530 798 540 808"/>
<path class="ember soft" d="M580 820 Q585 805 595 812"/>

</svg>